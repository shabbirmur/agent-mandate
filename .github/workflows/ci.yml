name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Scan repository history for secrets
        run: >-
          docker run --rm --network none
          -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source=/repo --no-banner --redact --log-opts=--all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose build
        env:
          VCS_REF: ${{ github.sha }}
      - name: Export gateway image for scanning
        run: docker image save -o /tmp/agent-mandate-gateway-image.tar agent-mandate-gateway:latest
      - name: Scan gateway image for high and critical CVEs
        run: >-
          docker run --rm
          -v /tmp/agent-mandate-gateway-image.tar:/image.tar:ro
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --input /image.tar --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1 --no-progress
          --format json --output /dev/null
      - run: docker compose up -d --wait
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://mandate:local-postgres-only@127.0.0.1:55432/agent_mandate
      - run: node test/docker-e2e.mjs
      - run: node test/docker-downstream-outage.mjs
      - run: npm run test:confidence
      - run: npm run test:load
        env:
          LOAD_REQUESTS: "20"
          LOAD_CONCURRENCY: "5"
      - run: npm run test:soak
        env:
          SOAK_DURATION_SECONDS: "10"
          SOAK_ACTIONS_PER_SECOND: "2"
          SOAK_CONCURRENCY: "3"
          SOAK_TOKEN_REFRESH_SECONDS: "3"
          SOAK_MIN_TOKEN_REFRESHES: "2"
      - if: always()
        continue-on-error: true
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
