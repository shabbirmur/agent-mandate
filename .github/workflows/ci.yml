name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://mandate:local-postgres-only@127.0.0.1:55432/agent_mandate
      - run: node test/docker-e2e.mjs
      - run: node test/docker-downstream-outage.mjs
      - run: npm run test:load
        env:
          LOAD_REQUESTS: "20"
          LOAD_CONCURRENCY: "5"
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
